server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    charset UTF-8;
    autoindex off;
    absolute_redirect off;

    # Security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # Next.js static assets (content-hashed) - кешируем на год
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML - не кешируем, чтобы новые деплои доходили сразу
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Остальное (иконки, манифест и т.д.) - умеренный кеш
    location / {
        expires 5d;
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    include api.conf;
}
