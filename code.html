<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Roboto:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .font-poppins { font-family: 'Poppins', sans-serif; }
      .font-roboto { font-family: 'Roboto', sans-serif; }
      .glowing-card {
        box-shadow: 0 0 25px 0 rgba(0, 122, 255, 0.15), 0 0 45px 0 rgba(0, 122, 255, 0.1);
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#007AFF",
              "background-light": "#f5f7f8",
              "background-dark": "#1A1A2E",
              "card-dark": "#1F2937",
              "text-light": "#F9FAFB",
              "text-secondary": "#9CA3AF",
              "error": "#EF4444"
            },
            fontFamily: {
              "display": ["Poppins", "sans-serif"],
              "body": ["Roboto", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.5rem", 
              "lg": "0.75rem",
              "xl": "1rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-body">
<div class="relative flex h-screen min-h-screen w-full flex-col items-center justify-center p-4">
<!-- Main Content Area -->
<div class="flex w-full max-w-sm flex-col items-center">
<!-- Logo -->
<div class="mb-8 flex items-center gap-3">
<svg fill="none" height="36" viewbox="0 0 24 24" width="36" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#007AFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2 17L12 22L22 17" stroke="#007AFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2 12L12 17L22 12" stroke="#007AFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<h1 class="font-display text-3xl font-bold text-text-light">Investa</h1>
</div>
<!-- Login Card -->
<div class="glowing-card w-full rounded-xl bg-card-dark p-8">
<div class="text-center">
<h2 class="font-display text-2xl font-semibold tracking-tight text-text-light">Welcome Back</h2>
<p class="text-text-secondary mt-2 text-sm">Sign in to access your dashboard.</p>
</div>
<form class="mt-8 space-y-6">
<!-- Email Input -->
<div class="flex flex-col">
<label class="text-text-light mb-2 text-sm font-medium" for="email">Email or Username</label>
<input class="form-input h-12 w-full rounded-lg border-2 border-transparent bg-[#272f3a] p-3 text-base text-text-light placeholder:text-text-secondary/60 focus:border-primary focus:outline-none focus:ring-0" id="email" placeholder="you@example.com" type="email"/>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between">
<label class="text-text-light mb-2 text-sm font-medium" for="password">Password</label>
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative mt-1">
<input class="form-input h-12 w-full rounded-lg border-2 border-error bg-[#272f3a] p-3 pr-10 text-base text-text-light placeholder:text-text-secondary/60 focus:border-primary focus:outline-none focus:ring-0" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-secondary" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
<p class="mt-2 text-sm text-error">Invalid email or password. Please try again.</p>
</div>
<!-- Sign In Button -->
<button class="flex h-12 w-full items-center justify-center rounded-lg bg-primary px-4 py-2 text-base font-semibold text-white transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-dark" type="submit">
                        Sign In
                    </button>
<!-- Loading State Example -->
<button class="mt-4 flex h-12 w-full items-center justify-center rounded-lg bg-primary/80 px-4 py-2 text-base font-semibold text-white transition-colors" disabled="" type="button">
<svg class="h-5 w-5 animate-spin text-white" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<span class="ml-3">Signing In...</span>
</button>
</form>
</div>
<!-- Sign Up Link -->
<div class="mt-8 text-center">
<p class="text-sm text-text-secondary">
                    Don't have an account? 
                    <a class="font-semibold text-primary hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</body></html>
